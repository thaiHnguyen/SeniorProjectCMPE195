# CI: runs on every push and every pull request into main.
#   backend  -> install Python deps, run pytest
#   frontend -> install Node deps, ESLint, production build
# A red X on a commit or PR means one of these failed. Click it to see which step.

name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]
  workflow_dispatch:        # "Run workflow" button in the Actions tab

# A newer push to the same branch cancels the older, still-running check
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend tests (pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      # Same Python as Raspberry Pi OS (Bookworm) on the Pi 5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      # Hardware libraries are commented out in requirements.txt, so CI
      # (and any laptop) runs with mock sensors
      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        env:
          USE_MOCK_SENSORS: "True"
        run: python -m pytest tests -q

  frontend:
    name: Frontend lint + build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      # Vite 7 needs Node 20.19+ or 22.12+
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      # Also catches file-name case mistakes (e.g. Logo_Light.png vs Logo_light.png)
      # that work on Windows/macOS but break on Linux and the Pi
      - name: Build
        run: npm run build